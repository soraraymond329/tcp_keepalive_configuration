[project]
name = "tcp-keepalive-configuration"
version = "0.1.0"
description = "Computes per-socket TCP keepalive option values from idle/interval/count settings for Linux, macOS, and Windows"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
